<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Planillas Perú</title><style>
:root{--bg:#f2f4f7;--pn:#fff;--tx:#1b2430;--mu:#5b6877;--bd:#d8dfe7;--ac:#1f4e79;--sb:#16283c;--ok:#1b7f4b;--wr:#a85f00;--er:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151e;--pn:#172130;--tx:#e5eaf0;--mu:#92a0b2;--bd:#2a3748;--ac:#3b7ec0;--sb:#0a1119;--ok:#4cc38a;--wr:#e0a64a;--er:#f2766f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e151e;--pn:#172130;--tx:#e5eaf0;--mu:#92a0b2;--bd:#2a3748;--ac:#3b7ec0;--sb:#0a1119;--ok:#4cc38a;--wr:#e0a64a;--er:#f2766f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:grid;grid-template-columns:210px 1fr}main{padding:14px;min-width:0}
nav{background:var(--sb);padding:8px 0}nav h4{color:#fff;margin:6px 14px;font-size:12px;letter-spacing:.08em}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:0;color:#cfd8e3;padding:9px 14px}nav button.on{background:rgba(255,255,255,.14);color:#fff}
@media(max-width:899px){#app{grid-template-columns:1fr}nav{display:flex;overflow-x:auto}nav h4{display:none}nav button{width:auto;white-space:nowrap}}
h2{margin:0 0 10px;font-size:18px}h3{margin:8px 0;font-size:14px}
.c{background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:12px}
.k{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}.k div{background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:8px}.k small{display:block;color:var(--mu)}.k b{font-size:16px}
.tw{overflow-x:auto;margin-top:8px}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}.l{text-align:left}th{background:var(--bg);color:var(--mu)}.tt td{font-weight:700}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:4px;padding:4px 6px}table input{width:84px;text-align:right}
button{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer}
.b{border:1px solid currentColor;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:400}.b0{color:var(--mu)}.b1{color:var(--wr)}.b2{color:var(--ac)}.b3,.b4{color:var(--ok)}
.br{display:flex;align-items:center;gap:6px;margin:3px 0}.br span{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br em{flex:1}.br i{display:block;height:10px;background:var(--ac);border-radius:2px;min-width:2px}
dialog{width:min(660px,94%);background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:8px;max-height:90%;overflow:auto}dialog::backdrop{background:#0008}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}label{display:block;color:var(--mu);font-size:12px}label input,label select,textarea{display:block;width:100%}.er{color:var(--er)}.mu{color:var(--mu)}
@media print{#app,.np{display:none!important}dialog{border:0}}
</style></head><body><div id="app"><nav></nav><main></main></div><dialog id="dlg"></dialog><script>
const $=s=>document.querySelector(s),KEY='planillasPE1',ES=['Borrador','Calculada','Revisada','Aprobada','Cerrada'];
const f=n=>(+n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){const d='2026-01-01',u='Referencial: verificar en SUNAT / MTPE / SBS';
const A=[['rmv','RMV (S/)',1130],['uit','UIT (S/)',5500],['onp','ONP (%)',13],['essalud','EsSalud empleador (%)',9],['vidaley','Vida Ley (%)',0.5],['asigfam','Asignación familiar (% de RMV)',10],['afp.obl','AFP aporte obligatorio (%)',10],['afp.Integra','AFP Integra: comisión, prima (%)','1.55,1.37'],['afp.Prima','AFP Prima: comisión, prima (%)','1.60,1.37'],['afp.Profuturo','AFP Profuturo: comisión, prima (%)','1.69,1.37'],['afp.Habitat','AFP Habitat: comisión, prima (%)','1.47,1.37'],['q.ded','Quinta: deducción (UIT)',7],['q.tr','Quinta: tramos hasta UIT:tasa%','5:8,20:14,35:17,45:20,9999:30'],['bonext','Bonif. extraordinaria gratificación (%)',9],['he.p1','Hora extra, 2 primeras horas (%)',25],['he.p2','Hora extra, resto (%)',35],['reg.General','Régimen General: gratif., CTS, días vacac.','1,1,30'],['reg.Pequeña','Pequeña empresa: gratif., CTS, días vacac.','0.5,0.5,15'],['reg.Micro','Microempresa: gratif., CTS, días vacac.','0,0,15']];
const W=(id,dni,nombre,cargo,ingreso,fin,sueldo,sis,afp,hijos,cuenta)=>({id,dni,nombre,cargo,ingreso,fin,cese:'',regimen:'General',sueldo,sis,afp,hijos,cuenta});
return{emp:{razon:'Mi Empresa SAC',ruc:'20000000001',dir:'Lima, Perú'},params:A.map(([k,n,v])=>({k,n,v,d,u,h:[]})),workers:[W('w1','45678901','Juan Pérez','Vendedor','2024-03-01','',2000,'AFP','Integra',1,'191-0000001'),W('w2','41234567','María Quispe','Asistente administrativa','2025-01-15','',1500,'ONP','',0,''),W('w3','40123456','Carlos Ramos','Contador','2023-06-01','2026-11-30',2500,'AFP','Prima',2,'191-0000003')],per:{},esc:[]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||seed();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
/* ===== MOTOR DE REGLAS (sin valores legales fijos: todo sale de S.params) ===== */
const P=k=>S.params.find(p=>p.k==k)?.v,N=k=>{const v=+P(k);if(P(k)===undefined||isNaN(v))throw Error('Parámetro inexistente o inválido: '+k);return v};
const M={reg:r=>{const[g,c,v]=String(P('reg.'+r)).split(',').map(Number);if(isNaN(g+c+v))throw Error('Régimen sin parámetros: '+r);return{g,c,v}},
afp:n=>{const[c,p]=String(P('afp.'+n)).split(',').map(Number);if(isNaN(c+p))throw Error('AFP sin tasas: '+n);return{c,p}},
quinta(b,g){const U=N('uit'),an=b*12+2*b*g*(1+N('bonext')/100),neto=Math.max(0,an-N('q.ded')*U);let imp=0,pv=0;for(const t of String(P('q.tr')).split(',')){const[h,r]=t.split(':').map(Number);if(isNaN(h+r))throw Error('Tramos de quinta inválidos');if(neto>pv){imp+=(Math.min(neto,h*U)-pv)*r/100;pv=h*U}}return{an,neto,imp,ret:imp/12}},
calc(w,i){const R=M.reg(w.regimen),s=+w.sueldo,vh=s/240,dias=Math.max(0,30-i.faltas),dev=s/30*dias,he=vh*(Math.min(i.he,2)*(1+N('he.p1')/100)+Math.max(i.he-2,0)*(1+N('he.p2')/100)),asig=w.hijos>0?N('rmv')*N('asigfam')/100:0,tar=vh/60*i.tard,bruto=dev+he+i.bonos+i.com+asig;
let prev,pl;if(w.sis=='ONP'){prev=bruto*N('onp')/100;pl='ONP'}else{const a=M.afp(w.afp);prev=bruto*(N('afp.obl')+a.c+a.p)/100;pl=w.afp}
const q=M.quinta(bruto,R.g),desc=prev+q.ret+tar+i.adel,b=s+asig,grat=b/6*R.g,bx=grat*N('bonext')/100,cts=(b+grat/6)/12*R.c,vac=b/12*R.v/30,ess=Math.max(bruto,N('rmv'))*N('essalud')/100,vl=bruto*N('vidaley')/100,prov=grat+bx+cts+vac;
return{dias,dev,he,asig,bruto,prev,pl,q,tar,adel:i.adel,desc,neto:bruto-desc,ess,vl,grat,bx,cts,vac,prov,costo:bruto+ess+vl+prov}}};
/* ===== DATOS DE PLANILLA ===== */
let PER=today().slice(0,7),V='dash',pg=1,q='';
const AF=()=>S.params.filter(p=>p.k.startsWith('afp.')&&p.k!='afp.obl').map(p=>p.k.slice(4)),RG=()=>S.params.filter(p=>p.k.startsWith('reg.')).map(p=>p.k.slice(4));
const gp=id=>S.per[id]||(S.per[id]={estado:'Borrador',inp:{},snap:{}}),I=(p,w)=>({faltas:0,tard:0,he:0,bonos:0,com:0,adel:0,...p.inp[w.id]}),sum=(a,k)=>a.reduce((t,x)=>t+(x.r[k]||0),0),sq=a=>a.reduce((t,x)=>t+x.r.q.ret,0);
function rows(){const p=gp(PER);let er='';const rs=S.workers.filter(w=>!w.cese).map(w=>{let r=p.snap[w.id];if(!r)try{r=M.calc(w,I(p,w))}catch(e){er=e.message}return{w,r}}).filter(x=>x.r);return{p,rs,er}}
const bars=(a,c)=>{const m=Math.max(1,...a.map(x=>x[1]));return a.map(([l,v])=>`<div class="br"><span>${esc(l)}</span><em><i style="width:${v/m*100}%"></i></em><b>${c?v:f(v)}</b></div>`).join('')};
/* ===== VISTAS ===== */
function dash(){const{p,rs,er}=rows(),s=k=>sum(rs,k),act=S.workers.filter(w=>!w.cese).length,sp=o=>rs.filter(x=>(x.r.pl=='ONP')==o).reduce((t,x)=>t+x.r.prev,0);
const K=[['Trabajadores activos',act,1],['Cesados',S.workers.length-act,1],['Remuneración bruta',s('bruto')],['Descuentos',s('desc')],['Neto a pagar',s('neto')],['Aportes empleador',s('ess')+s('vl')],['AFP',sp(false)],['ONP',sp(true)],['Quinta categoría',sq(rs)],['CTS provisionada',s('cts')],['Gratif. provisionada',s('grat')+s('bx')],['Vacac. provisionadas',s('vac')],['Costo total planilla',s('costo')]],reg={},al=[];
S.workers.forEach(w=>{reg[w.regimen]=(reg[w.regimen]||0)+1;const d=w.fin?(new Date(w.fin)-Date.now())/864e5:-1;if(d>=0&&d<=60)al.push(`Contrato de ${w.nombre} vence en ${Math.ceil(d)} días`);if(!w.cuenta)al.push(`Datos incompletos: ${w.nombre} sin cuenta bancaria`)});
return`<h2>Dashboard · ${PER} <span class="b b${ES.indexOf(p.estado)}">${p.estado}</span></h2><p class="er">${esc(er)}</p><div class="k">${K.map(([l,v,c])=>`<div><small>${l}</small><b>${c?v:'S/ '+f(v)}</b></div>`).join('')}</div><div class="fg"><div class="c"><h3>Costo total por trabajador</h3>${bars(rs.map(x=>[x.w.nombre,x.r.costo]))}</div><div class="c"><h3>AFP vs ONP (S/)</h3>${bars([['AFP',sp(false)],['ONP',sp(true)]])}<h3>Trabajadores por régimen</h3>${bars(Object.entries(reg),1)}</div></div><div class="c"><h3>Alertas</h3>${al.length?al.map(a=>`<div>⚠ ${esc(a)}</div>`).join(''):'Sin alertas'}</div>`}
function trab(){const t=q.toLowerCase(),L=S.workers.filter(w=>(w.nombre+w.dni+w.cargo).toLowerCase().includes(t)),n=Math.max(1,Math.ceil(L.length/10));pg=Math.min(pg,n);
return`<h2>Trabajadores</h2><div class="c"><input placeholder="Buscar DNI, nombre, cargo" value="${esc(q)}" onchange="q=this.value;pg=1;render()"> <button onclick="wf()">+ Nuevo</button> <button onclick="exp('w')">Exportar CSV</button><div class="tw"><table><tr><th class="l">DNI<th class="l">Nombre<th class="l">Cargo<th>Sueldo<th class="l">AFP/ONP<th class="l">Estado<th></tr>${L.slice(pg*10-10,pg*10).map(w=>`<tr><td class="l">${w.dni}<td class="l">${esc(w.nombre)}<td class="l">${esc(w.cargo)}<td>${f(w.sueldo)}<td class="l">${w.sis=='ONP'?'ONP':esc(w.afp)}<td class="l">${w.cese?'Cesado':'Activo'}<td><button onclick="wf('${w.id}')">Editar</button> <button onclick="dw('${w.id}')">✕</button>`).join('')}</table></div><p>Página ${pg}/${n} <button onclick="pg=Math.max(1,pg-1);render()">‹</button> <button onclick="pg=Math.min(${n},pg+1);render()">›</button></p></div>`}
function wf(id){const w=S.workers.find(x=>x.id==id)||{regimen:'General',sis:'AFP',afp:AF()[0],hijos:0,sueldo:''},F=(k,l,t='text')=>`<label>${l}<input id="f_${k}" type="${t}" value="${esc(w[k])}"></label>`,Sl=(k,l,o)=>`<label>${l}<select id="f_${k}">${o.map(x=>`<option${x==w[k]?' selected':''}>${x}`).join('')}</select></label>`;
$('#dlg').innerHTML=`<h3>${id?'Editar':'Nuevo'} trabajador</h3><div class="fg">${F('dni','DNI')}${F('nombre','Nombres y apellidos')}${F('cargo','Cargo')}${F('ingreso','Fecha de ingreso','date')}${F('fin','Fin de contrato','date')}${F('cese','Fecha de cese','date')}${Sl('regimen','Régimen',RG())}${F('sueldo','Sueldo básico','number')}${Sl('sis','Sistema',['AFP','ONP'])}${Sl('afp','AFP',AF())}${F('hijos','Hijos (asig. familiar)','number')}${F('cuenta','Cuenta / CCI')}</div><p id="msg" class="er"></p><button onclick="sw('${id||''}')">Guardar</button> <button onclick="$('#dlg').close()">Cancelar</button>`;$('#dlg').showModal()}
function sw(id){const g=k=>$('#f_'+k).value.trim(),w={id:id||'w'+Date.now(),dni:g('dni'),nombre:g('nombre'),cargo:g('cargo'),ingreso:g('ingreso'),fin:g('fin'),cese:g('cese'),regimen:g('regimen'),sueldo:+g('sueldo'),sis:g('sis'),afp:g('afp'),hijos:+g('hijos')||0,cuenta:g('cuenta')},e=[];
if(!/^\d{8}$/.test(w.dni))e.push('El DNI debe tener 8 dígitos');if(S.workers.some(x=>x.dni==w.dni&&x.id!=w.id))e.push('DNI duplicado');if(!w.nombre)e.push('Nombre obligatorio');if(!(w.sueldo>0))e.push('El sueldo debe ser mayor a 0');if(!w.ingreso)e.push('Fecha de ingreso obligatoria');if(w.cese&&w.cese<w.ingreso)e.push('Cese anterior al ingreso');if(w.fin&&w.fin<w.ingreso)e.push('Fin de contrato anterior al ingreso');
if(e.length)return $('#msg').textContent=e.join(' · ');const i=S.workers.findIndex(x=>x.id==w.id);i<0?S.workers.push(w):S.workers[i]=w;save();$('#dlg').close();render()}
function dw(id){S.workers=S.workers.filter(w=>w.id!=id);save();render()}
function plan(){const{p,rs,er}=rows(),ix=ES.indexOf(p.estado),ed=ix==0,s=k=>sum(rs,k),inp=(w,k)=>`<input type="number" min="0" step="any" value="${I(p,w)[k]}" ${ed?'':'disabled'} onchange="edt('${w.id}','${k}',this.value)">`;
return`<h2>Planilla mensual</h2><div class="c"><input type="month" value="${PER}" onchange="PER=this.value||PER;render()"> <span class="b b${ix}">${p.estado}</span> ${ed?'<button onclick="calcP()">Calcular planilla</button>':''}${ix>=1&&ix<4?` <button onclick="adv(1)">Pasar a ${ES[ix+1]}</button>`:''}${ix>=1&&ix<=2?' <button onclick="adv(-9)">Reabrir</button>':''} <button onclick="exp('p')">CSV</button>${ix==4?'<p class="mu">Planilla cerrada: no se puede modificar.</p>':''}<p class="er">${esc(er)}</p><div class="tw"><table><tr><th class="l">Trabajador<th>Sueldo<th>Faltas<th>Tard. min<th>H. extra<th>Bonos<th>Comis.<th>Adelanto<th>Bruto<th>AFP/ONP<th>Quinta<th>Descuentos<th>Neto<th>EsSalud+VL<th>Provis.<th>Costo empresa<th></tr>${rs.map(({w,r})=>`<tr><td class="l">${esc(w.nombre)}<td>${f(w.sueldo)}<td>${inp(w,'faltas')}<td>${inp(w,'tard')}<td>${inp(w,'he')}<td>${inp(w,'bonos')}<td>${inp(w,'com')}<td>${inp(w,'adel')}<td>${f(r.bruto)}<td>${f(r.prev)}<td>${f(r.q.ret)}<td>${f(r.desc)}<td><b>${f(r.neto)}</b><td>${f(r.ess+r.vl)}<td>${f(r.prov)}<td>${f(r.costo)}<td><button onclick="bol('${w.id}')">Boleta</button>`).join('')}<tr class="tt"><td class="l">Total<td><td><td><td><td><td><td><td>${f(s('bruto'))}<td>${f(s('prev'))}<td>${f(sq(rs))}<td>${f(s('desc'))}<td>${f(s('neto'))}<td>${f(s('ess')+s('vl'))}<td>${f(s('prov'))}<td>${f(s('costo'))}<td></table></div></div>`}
function edt(id,k,v){const p=gp(PER),w=S.workers.find(x=>x.id==id);if(p.estado!='Borrador')return;p.inp[id]={...I(p,w),[k]:Math.max(0,+v||0)};save();render()}
function calcP(){const p=gp(PER);p.snap={};for(const w of S.workers.filter(w=>!w.cese))try{p.snap[w.id]=M.calc(w,I(p,w))}catch(e){p.snap={};return render()}p.estado='Calculada';save();render()}
function adv(d){const p=gp(PER);if(d==-9){p.estado='Borrador';p.snap={}}else p.estado=ES[ES.indexOf(p.estado)+1];save();render()}
function bol(id){const{p,rs}=rows(),{w,r}=rs.find(y=>y.w.id==id),i=I(p,w),L=a=>a.map(([n,v])=>`<tr><td class="l">${n}<td>${f(v)}`).join('');
$('#dlg').innerHTML=`<h3>Boleta de pago · ${PER}</h3><p><b>${esc(S.emp.razon)}</b> · RUC ${esc(S.emp.ruc)}<br>${esc(S.emp.dir)}</p><p><b>${esc(w.nombre)}</b> · DNI ${w.dni} · ${esc(w.cargo)}<br>Ingreso: ${w.ingreso} · ${r.pl} · Días: ${r.dias}</p><table><tr><th class="l">INGRESOS<th>S/</tr>${L([['Sueldo',r.dev],['Horas extras',r.he],['Bonos',i.bonos],['Comisiones',i.com],['Asignación familiar',r.asig]])}<tr><th class="l">DESCUENTOS<th></tr>${L([[r.pl,r.prev],['Quinta categoría',r.q.ret],['Tardanzas',r.tar],['Adelantos',r.adel]])}<tr class="tt"><td class="l">Total bruto<td>${f(r.bruto)}<tr class="tt"><td class="l">Total descuentos<td>${f(r.desc)}<tr class="tt"><td class="l">NETO A PAGAR<td>${f(r.neto)}<tr><th class="l">APORTES EMPLEADOR<th></tr>${L([['EsSalud',r.ess],['Vida Ley',r.vl]])}<tr><th class="l">PROVISIONES<th></tr>${L([['Gratificación + bonif.',r.grat+r.bx],['CTS',r.cts],['Vacaciones',r.vac]])}<tr class="tt"><td class="l">COSTO REAL PARA LA EMPRESA<td>${f(r.costo)}</table><p class="mu">Quinta: renta anual proyectada ${f(r.q.an)} − deducción = renta neta ${f(r.q.neto)}; impuesto anual ${f(r.q.imp)}; retención mensual = impuesto / 12 (sin historial de meses previos).</p><button class="np" onclick="try{print()}catch(e){}">Imprimir / PDF</button> <button class="np" onclick="$('#dlg').close()">Cerrar</button>`;$('#dlg').showModal()}
/* ===== SIMULADOR (independiente de la planilla real) ===== */
let SIM={nombre:'Escenario',n:10,sueldo:1500,regimen:'General',sis:'ONP',afp:'Integra',hijos:0,bonos:0,he:0,com:0};
function sc(o){const r=M.calc({sueldo:o.sueldo,regimen:o.regimen,sis:o.sis,afp:o.afp,hijos:o.hijos},{faltas:0,tard:0,he:o.he,bonos:o.bonos,com:o.com,adel:0});return{r,n:o.n,mes:r.costo*o.n,ben:r.prov*12*o.n,apo:(r.ess+r.vl)*12*o.n,anio:r.costo*12*o.n}}
function ae(){S.esc.push({...SIM,nombre:SIM.nombre||'Escenario '+(S.esc.length+1)});save();render()}
function de(i){S.esc.splice(i,1);save();render()}
function sim(){let R,er='';try{R=sc(SIM)}catch(e){er=e.message}
const F=(k,l)=>`<label>${l}<input type="number" step="any" value="${SIM[k]}" onchange="SIM.${k}=+this.value||0;render()"></label>`,Sl=(k,l,o)=>`<label>${l}<select onchange="SIM.${k}=this.value;render()">${o.map(x=>`<option${x==SIM[k]?' selected':''}>${x}`).join('')}</select></label>`,
E=S.esc.map((o,i)=>{try{return{o,i,...sc(o)}}catch(e){}}).filter(Boolean),b=E[0],
U=(r,n)=>[['Remuneración bruta',r.bruto],['Descuentos del trabajador',r.desc],['Neto aproximado',r.neto],['Aportes del empleador',r.ess+r.vl],['Provisión CTS',r.cts],['Provisión gratificación',r.grat+r.bx],['Provisión vacaciones',r.vac],['Costo total empresa',r.costo]].map(([l,v])=>`<tr><td class="l">${l}<td>${f(v)}<td>${f(v*n)}<td>${f(v*n*12)}`).join('');
return`<h2>Simulador de costo laboral</h2><div class="c"><p class="mu">Separado de la planilla real: nada de aquí modifica los datos de la empresa.</p><div class="fg">${F('n','Cantidad de trabajadores')}${F('sueldo','Sueldo básico S/')}${Sl('regimen','Régimen',RG())}${Sl('sis','Sistema',['ONP','AFP'])}${Sl('afp','AFP',AF())}${F('hijos','Hijos (asig. familiar)')}${F('bonos','Bonos S/')}${F('com','Comisiones S/')}${F('he','Horas extras')}<label>Nombre<input value="${esc(SIM.nombre)}" onchange="SIM.nombre=this.value"></label></div><p class="er">${esc(er)}</p>${R?`<div class="tw"><table><tr><th class="l">Concepto<th>Por trabajador/mes<th>Total ${SIM.n}/mes<th>Total ${SIM.n}/año</tr>${U(R.r,SIM.n)}</table></div><p>Beneficios sociales anuales: <b>${f(R.ben)}</b> · Aportes anuales: <b>${f(R.apo)}</b> · Costo anual: <b>${f(R.anio)}</b> · Promedio mensual: <b>${f(R.anio/12)}</b></p><button onclick="ae()">Guardar como escenario</button>`:''}</div><div class="c"><h3>Comparador de escenarios</h3>${E.length?`<div class="tw"><table><tr><th class="l">Escenario<th>Trab.<th>Sueldo<th>Mensual<th>Anual<th>Beneficios<th>Aportes<th>Dif. S/<th>Dif. %<th></tr>${E.map(e=>`<tr><td class="l">${esc(e.o.nombre)}<td>${e.n}<td>${f(e.o.sueldo)}<td>${f(e.mes)}<td>${f(e.anio)}<td>${f(e.ben)}<td>${f(e.apo)}<td>${f(e.anio-b.anio)}<td>${f((e.anio-b.anio)/b.anio*100)}%<td><button onclick="de(${e.i})">✕</button>`).join('')}</table></div>${bars(E.map(e=>[e.o.nombre,e.anio]))}<p class="mu">Diferencias respecto al primer escenario.</p>`:'<p class="mu">Guarda escenarios para compararlos.</p>'}</div>`}
/* ===== CONFIGURACIÓN ===== */
function conf(){const E=S.emp;return`<h2>Configuración</h2><div class="c"><h3>Empresa</h3><div class="fg">${['razon:Razón social','ruc:RUC','dir:Dirección'].map(x=>{const[k,l]=x.split(':');return`<label>${l}<input value="${esc(E[k])}" onchange="S.emp.${k}=this.value;save()"></label>`}).join('')}</div></div><div class="c"><h3>Parámetros laborales y tasas</h3><p class="mu">Editables. Al cambiar un valor se guarda el anterior en el historial; las planillas ya calculadas conservan sus montos.</p><div class="tw"><table><tr><th class="l">Parámetro<th>Valor<th>Vigencia desde<th class="l">Fuente<th>Estado<th>Historial</tr>${S.params.map((p,i)=>`<tr><td class="l">${esc(p.n)}<td><input value="${esc(p.v)}" onchange="sp(${i},'v',this.value)"><td><input type="date" value="${p.d}" onchange="sp(${i},'d',this.value)"><td class="l"><input value="${esc(p.u)}" onchange="sp(${i},'u',this.value)"><td>${p.d<=today()?'Vigente':'Futuro'}<td title="${esc(p.h.map(h=>h.d+': '+h.v).join(' | '))}">${p.h.length}`).join('')}</table></div></div>`}
function sp(i,k,v){const p=S.params[i];if(k=='v'&&String(v)!=String(p.v)){p.h.push({v:p.v,d:p.d});p.d=today()}p[k]=k=='v'&&v.trim()!==''&&!isNaN(+v)?+v:v;save();render()}
function exp(t){let a;if(t=='w')a=[['DNI','Nombre','Cargo','Ingreso','Régimen','Sueldo','Sistema'],...S.workers.map(w=>[w.dni,w.nombre,w.cargo,w.ingreso,w.regimen,w.sueldo,w.sis=='ONP'?'ONP':w.afp])];else a=[['DNI','Trabajador','Bruto','AFP/ONP','Quinta','Descuentos','Neto','EsSalud+VidaLey','Provisiones','Costo empresa'],...rows().rs.map(({w,r})=>[w.dni,w.nombre,...[r.bruto,r.prev,r.q.ret,r.desc,r.neto,r.ess+r.vl,r.prov,r.costo].map(x=>x.toFixed(2))])];
$('#dlg').innerHTML=`<h3>Exportar CSV</h3><textarea id="ta" readonly rows="10">${esc(a.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'))}</textarea><p><button onclick="try{navigator.clipboard.writeText($('#ta').value)}catch(e){$('#ta').select()}">Copiar</button> <button onclick="$('#dlg').close()">Cerrar</button></p>`;$('#dlg').showModal()}
const NAV=[['dash','Dashboard'],['trab','Trabajadores'],['plan','Planilla mensual'],['sim','Simulador de costo'],['conf','Configuración']],VW={dash,trab,plan,sim,conf};
function render(){$('nav').innerHTML='<h4>PLANILLAS PERÚ</h4>'+NAV.map(([k,l])=>`<button class="${k==V?'on':''}" onclick="V='${k}';render()">${l}</button>`).join('');$('main').innerHTML=VW[V]()}
render();
</script></body></html>
